<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Loop Redirect</title>
  <script>
    const links = [
      "https://maper.info/RNZFwf",
      "https://maper.info/googlemapaddress"
    ];

    let i = 0;

    function loop() {
      window.location.href = links[i];
      i = (i + 1) % links.length;
    }

    // Change link every 3 seconds
    setInterval(loop, 3000);

    // Start immediately
    loop();
  </script>
</head>
<body>
</body>
</html>
